<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>言霊バトル 操作テスト</title>
  <style>
    body { margin: 0; padding: 16px; font: 14px/1.6 ui-monospace, Menlo, monospace; background: #fff; color: #111; }
    body[data-status="pass"] { border-top: 6px solid #1a7f37; }
    body[data-status="fail"] { border-top: 6px solid #b3261e; }
    pre { white-space: pre-wrap; margin: 0 0 12px; }
    iframe { width: 375px; height: 700px; border: 1px solid #ccc; }
  </style>
  <script type="module" src="index.js"></script>
</head>
<body>
  <p id="running"></p>
  <pre id="results">running…（CPU戦・フレンド戦を1試合ずつ含むため1〜2分かかります。?only=input / cpu / friend で1つだけ実行）</pre>
  <iframe id="app" title="テスト対象のアプリ（ホスト）"></iframe>
  <iframe id="app2" title="テスト対象のアプリ（ゲスト）"></iframe>
</body>
</html>
